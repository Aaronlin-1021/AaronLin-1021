  <style>
    /* --------------------------------------------------
       韓系極簡 (清冷灰 x 莫蘭迪色 x 燕麥色) 變數設定
    -------------------------------------------------- */
    :root {
      --bg-main: #F2EFF4;            /* 燕麥輕灰底色 (Oatmeal Soft Grey) */
      --card-bg: #FFFFFF;            /* 純白純潔卡片 (White) */
      --text-main: #333942;          /* 深清冷灰主文字 (Cool Dark Slate Gray) */
      --text-sub: #7A8493;           /* 莫蘭迪灰藍次要文字 (Morandi Slate Blue-Gray) */
      --accent-color: #6C7A89;       /* 莫蘭迪霧藍灰 (Morandi Steel Blue Accent) */
      --accent-light: #E8ECEF;       /* 淡莫蘭迪灰藍背景 (Morandi Light Tint) */
      --highlight: #A87D77;          /* 莫蘭迪乾燥玫瑰/莫蘭迪赭棕強調色 (Morandi Dusty Rose/Muted Clay) */
      --border-color: #E2E5EA;       /* 細微清冷灰邊框 (Cool Grey Border) */
      --shadow-sm: 0 4px 14px rgba(51, 57, 66, 0.04);
      --shadow-md: 0 6px 20px rgba(51, 57, 66, 0.07);
      --radius: 16px;
      --radius-sm: 10px;
      --font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      letter-spacing: 0.02em;
      line-height: 1.6;
      max-width: 390px;
      margin: 0 auto;
      padding: 16px 16px 60px 16px;
      touch-action: manipulation;
    }

    /* 隱藏原生 Radio */
    input[type="radio"] {
      display: none;
    }

    /* --------------------------------------------------
       頂部 Header & 航班卡片
    -------------------------------------------------- */
    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--accent-color);
      background: var(--accent-light);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header-meta {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .flight-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
